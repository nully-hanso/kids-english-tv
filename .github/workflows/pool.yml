# 매일 아침(한국 시간 새벽 4시) '오늘의 추천' 영상 모음(pool.json)을 새로 만듭니다.
name: Refresh video pool
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_pool.py
      - name: Commit if changed
        run: |
          git diff --quiet pool.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool.json
          git commit -m "Refresh video pool"
          git push
