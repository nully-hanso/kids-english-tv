<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1533">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>우리집 English TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap">
<style>
/* 첫 화면은 작은 극장: 막이 드리운 스크린에 약속 한 줄, 그 앞에 '티켓' 3장. 고른 영상을 끝까지 보면 '다 봤어요' 도장이 찍혀요.
   고르는 화면: 묶음 탭 → 채널별로 영상이 가로로 줄지어 있어요. */
:root {
  --bg: #eef2ff;
  --paper: #ffffff;
  --ink: #1c2b4b;
  --muted: #66759a;
  --line: #d9dff2;
  --coral: #f2545b;
  --sun: #ffc43d;
  --teal: #1fa898;
  --hall: #1b1533;      /* 극장 벽 */
  --hall-2: #2c2456;
  --velvet: #b3123f;    /* 막 */
  --velvet-2: #7e0b2c;
  --bulb: #ffd36b;      /* 간판 전구 */
  --dim: #b4add6;       /* 어두운 바탕의 보조 글씨 */
  --display: "Fredoka", "Jua", system-ui, sans-serif;
  --ko: "Jua", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--hall); color: var(--ink); font-family: var(--ko);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

/* ---------- 첫 화면 ---------- */
.home {
  min-height: 100%; display: flex; flex-direction: column;
  background: radial-gradient(120% 70% at 50% 18%, var(--hall-2), var(--hall) 70%); color: #fff;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.top { display: flex; align-items: center; gap: 10px; }
/* 극장 간판: 점선 테두리가 전구처럼 */
.brand {
  font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--bulb);
  border: 5px dotted var(--bulb); border-radius: 12px; padding: 4px 12px;
  text-shadow: 0 0 10px rgba(255,211,107,.6); filter: drop-shadow(0 0 4px rgba(255,211,107,.45));
}
.timers { margin-left: auto; display: flex; gap: 6px; }
.timerbtn {
  border: 0; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; padding: 8px 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; font-family: var(--ko); font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.timerbtn[aria-pressed="true"] { background: var(--bulb); color: var(--ink); }

.center {
  flex: 1; width: 100%; max-width: 460px; margin: 0 auto;
  display: flex; flex-direction: column; justify-content: center; padding: 44px 0 24px;
}
/* 스크린과 막 */
.theater { position: relative; padding: 0 30px; }
.valance {
  position: absolute; left: 0; right: 0; top: -14px; height: 26px; z-index: 2;
  background:
    radial-gradient(circle at 50% 0, var(--velvet) 13px, transparent 14px) 0 6px / 28px 20px repeat-x,
    linear-gradient(var(--velvet), var(--velvet)) 0 0 / 100% 10px no-repeat;
}
.theater::before, .theater::after {
  content: ""; position: absolute; top: -14px; bottom: -18px; width: 40px; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--velvet) 0 7px, var(--velvet-2) 7px 12px, #cf2453 12px 16px, var(--velvet) 16px 20px);
}
.theater::before { left: 0; border-bottom-right-radius: 70% 26px; }
.theater::after { right: 0; border-bottom-left-radius: 70% 26px; }
.screen {
  background: linear-gradient(#ffffff, #e7e9fb); color: var(--ink); border-radius: 10px;
  padding: 40px 16px 34px; box-shadow: 0 0 70px rgba(170,180,255,.35);
}
.motto-ko { margin: 10px 0 0; text-align: center; font-family: var(--ko); font-size: 16px; color: var(--muted); }
.motto { font-family: var(--display); font-weight: 600; font-size: clamp(29px, 8.2vw, 54px); line-height: 1.12; text-align: center; margin: 0; letter-spacing: -.5px; }
.sub { text-align: center; color: var(--dim); font-size: 18px; margin: 30px 0 22px; }

.tickets { display: flex; flex-direction: column; gap: 16px; }
.ticket {
  --c: var(--coral);
  position: relative; display: flex; align-items: stretch; width: 100%; min-height: 104px;
  border: 0; padding: 0; cursor: pointer; text-align: left; background: var(--paper); color: var(--ink);
  border-radius: 18px; overflow: hidden;
  /* 양옆 반원 홈: 티켓 모양 */
  -webkit-mask: radial-gradient(circle 13px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 13px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 13px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 13px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  transition: transform .12s ease;
}
.ticket:nth-child(2) { --c: var(--sun); }
.ticket:nth-child(3) { --c: var(--teal); }
.ticket:active { transform: scale(.98); }
.ticket .stub { flex: none; width: 40%; background: var(--c); padding: 10px 10px 10px 18px; display: flex; align-items: center; }
.ticket .stub img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: rgba(255,255,255,.4); }
.ticket .body {
  flex: 1; min-width: 0; padding: 12px 22px 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 6px;
  border-left: 3px dashed var(--line);
}
.ticket .t { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ticket .m { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.ticket .bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
/* 빈 티켓 */
.ticket.empty { background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 3px rgba(255,255,255,.16); -webkit-mask: none; mask: none; border-radius: 18px; align-items: center; justify-content: center; color: var(--dim); font-size: 20px; gap: 8px; }
.ticket.empty::before { content: "+"; font-family: var(--display); font-size: 30px; line-height: 1; color: var(--c); }
/* 다 본 티켓: 도장 */
.ticket.done .stub img, .ticket.done .t { opacity: .45; }
.stamp.quit { border-color: #4b587c; color: #4b587c; background: #fff; }
.stamp {
  position: absolute; right: 18px; top: 50%; transform: translateY(-50%) rotate(-14deg);
  border: 3px solid var(--coral); color: var(--coral); border-radius: 12px; padding: 4px 10px;
  font-family: var(--ko); font-size: 20px; background: rgba(255,255,255,.85);
}
.ticket.just .stamp { animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: translateY(-50%) rotate(-14deg) scale(2.2); opacity: 0; } }
.ticket.holding::after { content: ""; position: absolute; inset: 0; background: rgba(242,84,91,.25); transform-origin: left; animation: fill 3s linear forwards; }
@keyframes fill { from { transform: scaleX(0); } }

.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.door {
  border: 0; border-radius: 20px; padding: 18px 10px 16px; cursor: pointer; color: #fff;
  background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
  display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .12s ease;
}
.door:active { transform: scale(.97); }
.door .dt { font-size: 21px; }
.door .dm { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--bulb); line-height: 1.15; }
.door .ds { font-size: 14px; color: var(--dim); text-align: center; line-height: 1.3; min-height: 2.6em; margin-top: 4px; }
/* 타이머 전에는 막이 반쯤 닫혀 있다가, 누르면 열려요 */
.theater::before, .theater::after { transition: width .9s cubic-bezier(.5,0,.2,1); }
.home.idle .theater::before, .home.idle .theater::after { width: 17%; }
.stamps { display: flex; justify-content: center; gap: 18px; margin-top: 26px; }
.spot {
  width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  border: 3px dashed rgba(255,255,255,.28); font-family: var(--ko); font-size: 13px; line-height: 1.15; color: var(--dim); white-space: nowrap;
}
.spot.done { border: 3px solid var(--coral); color: var(--coral); background: #fff; transform: rotate(-12deg); }
.spot.quit { border: 3px solid #8a93b3; color: #4b587c; background: #fff; transform: rotate(-12deg); }
.habit { text-align: center; color: var(--dim); font-size: 15px; margin: 12px 0 0; }
.cta {
  margin: 28px auto 0; display: block; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--bulb); color: var(--ink); font-family: var(--ko); font-size: 21px; padding: 15px 30px;
}
.undo { display: block; margin: 20px auto 0; border: 0; background: none; color: var(--dim); font-family: var(--ko); font-size: 16px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 8px; }
.pundo { color: var(--muted); margin: 6px auto 0; padding: 4px 8px; flex: none; }
.foot { text-align: center; color: var(--dim); font-size: 14px; margin: 0; opacity: .8; }
.foot a { color: var(--dim); }
@media (orientation: landscape) and (min-width: 700px) {
  .center { max-width: 900px; padding-top: 16px; }
  .tickets { flex-direction: row; }
  .ticket { flex-direction: column; min-height: 0;
    -webkit-mask: radial-gradient(circle 13px at 50% 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 13px at 50% 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
            mask: radial-gradient(circle 13px at 50% 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 13px at 50% 100%, #0000 97%, #000) bottom / 100% 51% no-repeat; }
  .ticket .stub { width: 100%; padding: 14px 18px 10px; }
  .ticket .body { border-left: 0; border-top: 3px dashed var(--line); padding: 10px 18px 14px; }
  .ticket.empty { min-height: 200px; }
  .stamp { top: 34%; right: 50%; transform: translate(50%, -50%) rotate(-14deg); }
}
/* 아이패드처럼 큰 화면: 전체를 키우고 가운데에 넉넉히 */
@media (min-width: 700px) and (min-height: 600px) {
  .home { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-top: calc(22px + env(safe-area-inset-top, 0px)); }
  .brand { font-size: 24px; padding: 5px 16px; }
  .timerbtn { font-size: 19px; padding: 10px 16px; }
  .center { max-width: min(880px, 100%); padding: 24px 0 32px; }
  .theater { padding: 0 64px; }
  .theater::before, .theater::after { width: 60px; }
  .home.idle .theater::before, .home.idle .theater::after { width: 21%; }
  .valance { top: -18px; height: 32px; background:
      radial-gradient(circle at 50% 0, var(--velvet) 16px, transparent 17px) 0 8px / 34px 24px repeat-x,
      linear-gradient(var(--velvet), var(--velvet)) 0 0 / 100% 12px no-repeat; }
  .screen { padding: clamp(40px, 7vh, 80px) 24px clamp(34px, 6vh, 64px); border-radius: 14px; }
  .motto { font-size: clamp(54px, 7vw, 84px); }
  .motto-ko { font-size: 22px; margin-top: 14px; }
  .sub { font-size: 22px; margin: 34px 0 24px; }
  .doors { gap: 24px; }
  .door { padding: 30px 16px 26px; border-radius: 26px; }
  .door .dt { font-size: 28px; }
  .door .dm { font-size: 58px; }
  .door .ds { font-size: 18px; }
  .ticket { min-height: 132px; }
  .ticket .t { font-size: 19px; }
  .ticket .m { font-size: 16px; }
  .ticket.empty { font-size: 24px; }
  .stamp { font-size: 22px; }
  .stamps { gap: 28px; margin-top: 32px; }
  .spot { width: 88px; height: 88px; font-size: 16px; }
  .habit { font-size: 19px; }
  .cta { font-size: 24px; padding: 18px 38px; }
  .undo { font-size: 18px; }
  .foot { font-size: 16px; }
}
@media (orientation: portrait) and (min-width: 700px) {
  .center { max-width: min(720px, 100%); }
  .ticket .stub { width: 32%; }
  .home:not(.idle) .screen { padding: 30px 24px 24px; }
  .home:not(.idle) .motto { font-size: clamp(44px, 6.4vw, 60px); }
  .home:not(.idle) .sub { margin: 26px 0 18px; }
}
@media (orientation: landscape) and (min-width: 700px) and (min-height: 600px) {
  .center { max-width: min(1000px, 100%); }
  .ticket.empty { min-height: 200px; }
  /* 극장이 열리면 스크린을 줄여 티켓과 도장판이 한 화면에 들어오게 */
  .home:not(.idle) .center { padding-top: 18px; }
  .home:not(.idle) .screen { padding: 20px 24px 16px; }
  .home:not(.idle) .motto { font-size: clamp(38px, 4.4vw, 54px); }
  .home:not(.idle) .motto-ko { font-size: 18px; margin-top: 8px; }
  .home:not(.idle) .sub { margin: 24px 0 18px; }
  .home:not(.idle) .ticket .stub { padding: 12px 16px 8px; }
  .home:not(.idle) .stamps { margin-top: 22px; }
}
@media (orientation: landscape) and (max-height: 500px) { .center { padding-top: 22px; } .screen { padding: 18px 16px 14px; } .sub { margin: 20px 0 14px; } }

/* ---------- 고르는 화면 ---------- */
.picker {
  position: fixed; inset: 0; z-index: 10; background: var(--paper); display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
.phead { padding: 10px 16px 0; display: flex; align-items: center; gap: 10px; }
.close { border: 0; background: var(--bg); border-radius: 999px; padding: 9px 16px; font-family: var(--ko); font-size: 17px; cursor: pointer; flex: none; }
.tray { display: flex; gap: 6px; flex: 1; justify-content: center; min-width: 0; }
.slot { width: 64px; aspect-ratio: 16 / 9; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; border: 0; padding: 0; background: var(--bg); cursor: pointer; flex: 0 1 auto; position: relative; }
.slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot:nth-child(1) { --c: var(--coral); } .slot:nth-child(2) { --c: var(--sun); } .slot:nth-child(3) { --c: var(--teal); }
.slot.on { box-shadow: 0 0 0 3px var(--c); }
.tray.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.ok { border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 9px 16px; font-family: var(--ko); font-size: 17px; cursor: pointer; flex: none; }
.ok:disabled { background: var(--line); color: var(--muted); cursor: default; }
.ptabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 10px; scrollbar-width: none; flex: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex: none; border: 0; border-radius: 999px; padding: 9px 15px; background: var(--bg); font-family: var(--ko); font-size: 17px; cursor: pointer; }
.ptab[aria-pressed="true"] { background: var(--g); color: #fff; }
.pbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 calc(24px + env(safe-area-inset-bottom, 0px)); }
.chrow { margin: 14px 0 22px; }
.chname { display: flex; align-items: center; gap: 10px; padding: 0 16px; margin: 0 0 10px; font-family: var(--display); font-weight: 600; font-size: 18px; }
.chname img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--bg); flex: none; }
.chname small { font-family: var(--ko); font-size: 13px; color: var(--muted); font-weight: 400; }
.strip { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 6px; scroll-snap-type: x proximity; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.vid { flex: none; width: 168px; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; }
.vthumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--bg); }
.vthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dur { position: absolute; right: 6px; bottom: 6px; background: rgba(28,43,75,.85); color: #fff; font-family: var(--display); font-size: 12px; padding: 1px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.vt { font-family: var(--display); font-weight: 500; font-size: 14px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vid.picked .vthumb { box-shadow: 0 0 0 4px var(--c); }
.vid.picked .vthumb::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(28,43,75,.45); color: #fff; font-family: var(--display); font-size: 36px; font-weight: 700; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 12px; padding: 10px 16px; }
.hgrid .vid { width: auto; }
.vch { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { color: var(--muted); text-align: center; padding: 40px 24px; font-size: 18px; line-height: 1.5; }

/* ---------- 플레이어 ---------- */
.player {
  position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.pbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.back { border: 0; border-radius: 999px; background: var(--sun); color: var(--ink); padding: 9px 18px; font-family: var(--ko); font-size: 19px; cursor: pointer; display: flex; align-items: center; gap: 6px; flex: none; }
.now { color: #fff; font-family: var(--display); font-size: 17px; font-weight: 600; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timepill { flex: none; color: #fff; background: rgba(255,255,255,.16); border-radius: 999px; padding: 7px 12px; font-family: var(--display); font-variant-numeric: tabular-nums; }
.quit { flex: none; border: 0; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; padding: 8px 14px; font-family: var(--ko); font-size: 16px; cursor: pointer; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px 12px; }
.frame { width: 100%; aspect-ratio: 16 / 9; flex: none; }
.frame iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; background: #000; }

/* 다 봤어요 / 시간 끝 */
.cheer, .timeup {
  position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 24px; text-align: center;
}
.cheer { background: var(--bg); }
.cheer h2, .timeup h2 { font-family: var(--ko); font-weight: 400; font-size: clamp(30px, 8vw, 48px); margin: 0; }
.cheer p { margin: 0; font-size: 19px; color: var(--muted); }
.cheer .big { width: 124px; height: 124px; border-radius: 50%; border: 6px solid var(--coral); color: var(--coral); display: grid; place-items: center; font-family: var(--ko); font-size: 25px; transform: rotate(-12deg); animation: stamp2 .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp2 { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } }
.cheer button { margin-top: 10px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 14px 28px; font-family: var(--ko); font-size: 20px; cursor: pointer; }
.timeup { background: var(--ink); color: #fff; z-index: 50; }
.timeup .moon { width: 110px; height: 110px; }
.timeup p { margin: 0; font-size: 20px; color: #c3cde6; }
.hold { position: relative; overflow: hidden; margin-top: 24px; border: 2px solid rgba(255,255,255,.35); border-radius: 999px; background: transparent; color: #c3cde6; padding: 12px 22px; font-family: var(--ko); font-size: 17px; cursor: pointer; -webkit-touch-callout: none; touch-action: none; }
.hold::before { content: ""; position: absolute; inset: 0; background: rgba(255,196,61,.45); transform: scaleX(0); transform-origin: left; z-index: -1; }
.hold.holding::before { transform: scaleX(1); transition: transform 3s linear; }

@media (prefers-reduced-motion: reduce) {
  .ticket, .ticket.just .stamp, .cheer .big, .tray.shake, .ticket.holding::after, .theater::before, .theater::after, .door { transition: none; animation: none; }
}
</style>
</head>

   오늘 요일의 시리즈를 이어서 틀어요. 한 화가 끝나면 다음 화, 15분이 되면 멈추고 다음 방송에 그 자리부터. */
let sprog = store.get("sprog", {});   // { A: { i: 몇 번째 화, pos }, B: { seen: [본 영상], cur, pos } }
const todayKey = () => { const d = new Date().getDay(); return Object.keys(SERIES).find(k => SERIES[k].days.includes(d)) || "A"; };
function episodes(k) {
  const s = SERIES[k];
  if (s.lists) { const seen = new Set(); return s.lists.flatMap(l => SERIES_EPS[l] || []).filter(e => !seen.has(e.id) && seen.add(e.id)); }
  const per = s.mix.map(key => POOL.filter(v => v.key === key)), out = [];
  for (let i = 0; i < 30; i++) per.forEach(a => a[i] && out.push(a[i]));   // 채널을 번갈아
  return out;
}
function nextEp(k) {
  const eps = episodes(k), p = sprog[k] || {};
  if (!eps.length) return null;
  if (SERIES[k].lists) { const i = (p.i || 0) % eps.length; return { ep: eps[i], no: i + 1 }; }
  const seen = new Set(p.seen || []);
  return { ep: eps.find(e => e.id === p.cur) || eps.find(e => !seen.has(e.id)) || eps[0] };
}
function advanceEp(k) {
  const p = sprog[k] || {};
  if (SERIES[k].lists) sprog[k] = { i: (p.i || 0) + 1, pos: 0 };
  else sprog[k] = { seen: [...(p.seen || []), p.cur].filter(Boolean).slice(-300), cur: null, pos: 0 };
  store.set("sprog", sprog);
}
function nextEps(k, count) {
  const eps = episodes(k), p = sprog[k] || {}, s = SERIES[k];
  let list;
  if (s.lists) { const i = p.i || 0; list = eps.slice(i, i + count).map((e, j) => ({ ...e, no: i + j + 1 })); }
  else { const seen = new Set(p.seen || []); const first = eps.find(e => e.id === p.cur);
         list = [first, ...eps.filter(e => !seen.has(e.id) && e.id !== p.cur)].filter(Boolean).slice(0, count); }
  return list.map(e => {
    const v = { id: e.id, title: e.no ? `${e.no}화 ${e.title}` : e.title, ch: e.ch || s.name, key: e.key || "series:" + k, cat: e.cat || null, sec: e.sec };
    seriesCards[v.id] = v; return v;
  });
}
// 오후 극장에서 끝까지 본 영상이 아침 방송 시리즈에 있으면, 아침 방송도 그다음부터
function syncSeries(id) {
  for (const k of Object.keys(SERIES)) {
    const s = SERIES[k], p = sprog[k] || {};
    if (s.lists) {
      const idx = episodes(k).findIndex(e => e.id === id);
      if (idx >= (p.i || 0)) sprog[k] = { i: idx + 1, pos: 0 };
    } else if (episodes(k).some(e => e.id === id)) {
      sprog[k] = { seen: [...(p.seen || []), id].slice(-300), cur: p.cur === id ? null : p.cur, pos: p.cur === id ? 0 : (p.pos || 0) };
    }
  }
  store.set("sprog", sprog);
}
function epLabel(k, n) { const s = SERIES[k]; return `${s.label}: ${s.name}${n && n.no ? ` ${n.no}화` : ""}`; }
function playMorning() {
  if (timeUp || mode !== "morning" || !timerEnd) return;
  const k = todayKey(), n = nextEp(k);
  if (!n) { alert("방송을 불러오는 중이에요. 잠시 뒤에 다시 눌러 주세요."); return; }
  if (!SERIES[k].lists) { sprog[k] = { ...(sprog[k] || {}), cur: n.ep.id }; store.set("sprog", sprog); }
  playVideo({ ...n.ep, series: k, no: n.no });
}
function onEpisodeEnd() {
  const k = cur.series; advanceEp(k);
  const n = nextEp(k); if (!n) return closePlayer();
  if (!SERIES[k].lists) { sprog[k].cur = n.ep.id; store.set("sprog", sprog); }
  cur = { ...n.ep, series: k, no: n.no }; lastT = 0;
  $("#now").textContent = cur.title;
  try { player.loadVideoById(cur.id, 0); } catch {}
}

/* ---------- 첫 화면 ---------- */
// 다 봤거나(done) 그만뒀으면(quit) 그 티켓은 쓴 것
const isDone = v => !!(v && prog[v.id] && (prog[v.id].done || prog[v.id].quit));
const isQuit = v => !!(v && prog[v.id] && prog[v.id].quit);
function renderHome(justId) {
  const m = timerEnd ? mode : null;
  $("#home").classList.toggle("idle", !m);
  $("#undo").hidden = !inGrace();
  $("#doors").hidden = !!m;

  if (m !== "theater") {

    $("#mottoKo").hidden = m === "morning";
    $("#morningInfo").textContent = epLabel(k, nextEp(k));
    const left = basket.items.filter(v => !isDone(v)).length;

  $("#tickets").innerHTML = [0, 1, 2].map(i => {

    return `<button class="ticket${done ? " done" : ""}${justId === v.id ? " just" : ""}" type="button" data-i="${i}">
      <span class="stub"><img src="${thumb(v.id)}" alt="" referrerpolicy="no-referrer"></span>
      <span class="body">
        <span class="t">${esc(v.title)}</span>

        ${!done && pct > 0 ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ""}
      </span>
      ${done ? (isQuit(v) ? '<span class="stamp quit">그만 봤어요</span>' : '<span class="stamp">다 봤어요</span>') : ""}
    </button>`;
  }).join("");

  const cta = $("#cta");
  if (!basket.locked) {
    $("#sub").textContent = items.length ? `${3 - items.length}개 더 골라요` : "보고 싶은 영상 3개를 골라 담아요";
    cta.hidden = false; cta.textContent = items.length ? "마저 고르기" : "영상 3개 고르기";
  } else if (doneN === 3) {
    $("#sub").textContent = "티켓 3장을 다 썼어요. 새로 고를 수 있어요!";
    cta.hidden = false; cta.textContent = "새로 3개 고르기";
  } else {
    $("#sub").textContent = doneN ? `티켓이 ${3 - doneN}장 남았어요` : "티켓을 눌러서 봐요";
    cta.hidden = true;
  }
}

$("#goMorning").addEventListener("click", () => { startTimer(15, "morning"); playMorning(); });
$("#goTheater").addEventListener("click", () => {
  startTimer(30, "theater");
  if (!basket.locked) openPicker();
});
$("#cta").addEventListener("click", () => {

// 티켓 누르기: 정했으면 재생, 아직이면 고르기. 엄마 아빠는 3초 꾹 눌러서 티켓을 뺄 수 있어요.
let tHold = null, tHeld = false;
$("#tickets").addEventListener("pointerdown", e => {

["pointerup", "pointerleave", "pointercancel"].forEach(ev => $("#tickets").addEventListener(ev, () => {

/* ---------- 고르는 화면 ---------- */
let ptab = store.get("ptab", "words");
function openPicker() { if (timeUp || mode !== "theater" || !timerEnd) return; $("#picker").hidden = false; renderPicker(); }
// 처음 1분 동안 고르는 화면의 '닫기' 옆에 되돌리기 버튼
setInterval(() => { $("#pUndo").hidden = $("#picker").hidden || !inGrace(); }, 1000);
function closePicker() { $("#picker").hidden = true; renderHome(); }
$("#pClose").addEventListener("click", closePicker);
$("#pUndo").addEventListener("click", cancelTimer);
$("#pOk").addEventListener("click", () => {
  if (basket.items.length < 3) return;
  basket.locked = true; saveBasket(); closePicker();
});

function renderTray() {
  $("#tray").innerHTML = [0, 1, 2].map(i => {
    const v = basket.items[i];
    return `<button class="slot${v ? " on" : ""}" type="button" data-i="${i}" aria-label="${v ? esc(v.title) + " 빼기" : "빈 칸"}">${v ? `<img src="${thumb(v.id)}" alt="" referrerpolicy="no-referrer">` : ""}</button>`;
  }).join("");
  $("#pOk").disabled = basket.items.length < 3;
}
function vidCard(v, withCh) {
  const i = basket.items.findIndex(b => b.id === v.id);
  return `<button class="vid${i >= 0 ? " picked" : ""}" type="button" data-id="${v.id}" style="--c:${SLOT_COLORS[i] || ""}">
    <span class="vthumb"><img src="${thumb(v.id)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="dur">${mmss(v.sec)}</span></span>
    <span class="vt">${esc(v.title)}</span>
    ${withCh ? `<span class="vch">${esc(v.ch)}</span>` : ""}
  </button>`;
}
function avatar(ch) {
  if (ch.img) return `${IMG}${ch.img}=s88-c-k-c0x00ffffff-no-rj`;
  const v = ch.video || (ch.videos && ch.videos[0]) || (POOL.find(p => p.key === ch.key) || {}).id;
  return v ? thumb(v) : "";
}
function renderPicker() {
  renderTray();
  const tabs = [{ key: "series", label: "아침 방송 이어 보기", color: "#c27c00" }, ...GROUPS, { key: "again", label: "다시 보기", color: "#1c2b4b" }];
  if (!tabs.some(t => t.key === ptab)) ptab = "words";
  $("#ptabs").innerHTML = tabs.map(g =>
    `<button class="ptab" type="button" data-k="${g.key}" style="--g:${g.color}" aria-pressed="${g.key === ptab}">${g.label}</button>`).join("");
  const body = $("#pbody");
  if (ptab === "series") {
    // 시리즈마다 아침 방송에서 다음에 나올 영상들(보던 화가 맨 앞)
    const today = todayKey();
    body.innerHTML = Object.keys(SERIES).map(k => {
      const eps = nextEps(k, 8); if (!eps.length) return "";
      return `<section class="chrow">
        <h3 class="chname">${esc(SERIES[k].label)}: ${esc(SERIES[k].name)}${k === today ? ` <small>오늘 아침 방송</small>` : ""}</h3>
        <div class="strip">${eps.map(v => vidCard(v)).join("")}</div>
      </section>`;
    }).join("") || `<p class="note">방송 목록을 불러오는 중이에요</p>`;
    return;
  }
  if (ptab === "again") {
    body.innerHTML = history.length
      ? `<div class="hgrid">${history.map(v => vidCard(v, true)).join("")}</div>`
      : `<p class="note">끝까지 본 영상이 여기에 모여요.<br>좋아하는 영상을 다시 골라 볼 수 있어요.</p>`;
    return;
  }
  if (!POOL.length) { body.innerHTML = `<p class="note">영상 목록을 불러오는 중이에요</p>`; return; }
  const rows = CHANNELS.filter(ch => ch.cat === ptab).map(ch => {
    const vids = POOL.filter(v => v.key === ch.key);
    if (!vids.length) return "";
    return `<section class="chrow">
      <h3 class="chname"><img src="${avatar(ch)}" alt="" loading="lazy" referrerpolicy="no-referrer">${esc(ch.name)}${ch.lang ? ` <small>${ch.lang}</small>` : ""}</h3>
      <div class="strip">${vids.map(v => vidCard(v)).join("")}</div>
    </section>`;
  }).join("");
  body.innerHTML = rows || `<p class="note">이 묶음에는 아직 영상이 없어요</p>`;
}
$("#ptabs").addEventListener("click", e => {
  const b = e.target.closest(".ptab"); if (!b) return;
  ptab = b.dataset.k; store.set("ptab", ptab); renderPicker(); $("#pbody").scrollTop = 0;
});
let seriesCards = {};   // 고르는 화면에 그린 아침 방송 영상들
const findVideo = id => seriesCards[id] || POOL.find(v => v.id === id) || history.find(v => v.id === id);
$("#pbody").addEventListener("click", e => {
  const b = e.target.closest(".vid"); if (!b) return;
  const id = b.dataset.id, i = basket.items.findIndex(v => v.id === id);
  if (i >= 0) basket.items.splice(i, 1);
  else if (basket.items.length < 3) {
    const v = findVideo(id); if (!v) return;
    basket.items.push({ id: v.id, title: v.title, ch: v.ch, key: v.key, cat: v.cat, sec: v.sec });
    if (prog[v.id]) { delete prog[v.id]; store.set("prog", prog); }   // 다시 보는 영상은 처음부터
    // 아침에 보다 만 화면 그 자리부터(아침에 본 만큼은 본 걸로)
    for (const k of Object.keys(SERIES)) {
      const n = nextEp(k), sp = sprog[k] || {};
      if (n && n.ep.id === v.id && sp.pos > 5) { prog[v.id] = { pos: sp.pos, seen: sp.pos }; store.set("prog", prog); }
    }
  } else {
    const t = $("#tray"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
    return;
  }
  saveBasket(); renderTray();
  // 스크롤 위치를 지키려고 카드 표시만 바꿈
  document.querySelectorAll("#pbody .vid").forEach(el => {
    const k = basket.items.findIndex(v => v.id === el.dataset.id);
    el.classList.toggle("picked", k >= 0);
    el.style.setProperty("--c", SLOT_COLORS[k] || "");
  });
});
$("#tray").addEventListener("click", e => {
  const s = e.target.closest(".slot"); if (!s || !basket.items[+s.dataset.i]) return;
  basket.items.splice(+s.dataset.i, 1); saveBasket(); renderPicker();
});

/* ---------- 플레이어 ----------
   고른 영상 하나만 재생합니다. 보던 위치를 기억해 두었다가 다음에 이어서 틀어요.
   앞으로 넘기지 않고 실제로 80% 넘게 봐야 '다 봤어요' 도장이 찍혀요. */
let player = null, apiReady = false, pending = null, cur = null;
let pausedAt = 0, resumeOnReturn = false, lastT = 0;
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending) { const v = pending; pending = null; startPlayer(v); } };
(function () { const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

function playVideo(v) {
  if (timeUp) return;
  cur = v; lastT = 0;
  $("#now").textContent = v.title;
  $("#player").hidden = false; fitFrame();
  if (apiReady) startPlayer(v);
  else {
    pending = v;
    setTimeout(() => { if (pending === v) { pending = null; plainPlayer(v); } }, 5000);
  }
}
function startAt(v) { const p = v.series ? sprog[v.series] : prog[v.id]; return p && p.pos > 5 && p.pos < v.sec - 10 ? Math.floor(p.pos) : 0; }
function lang(v) {
  if (v.series) return SERIES[v.series].lang || "en";
  const ch = CHANNELS.find(c => c.key === v.key); return ch && ch.lang ? "ko" : "en";
}
function startPlayer(v) {
  if ($("#player").hidden) return;
  $("#frame").innerHTML = '<div id="yt"></div>';
  player = new YT.Player("yt", {
    host: "https://www.youtube.com",   // 로그인(유튜브 프리미엄)이 적용되도록 youtube.com 플레이어
    width: "100%", height: "100%", videoId: v.id,
    playerVars: { start: startAt(v), autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, hl: lang(v), cc_lang_pref: lang(v) },
    events: {
      onStateChange: e => {
        if (e.data === 2) pausedAt = Date.now();   // 2 = 일시정지
        if (e.data === 0) { if (cur && cur.series) onEpisodeEnd(); else finish(); }   // 0 = 끝
      },
    },
  });
}
function plainPlayer(v) {
  if ($("#player").hidden) return;
  $("#frame").innerHTML = `<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&playsinline=1&rel=0&start=${startAt(v)}"
    title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}
// 1초마다: 실제로 본 시간 세기, 위치 저장, 다른 영상으로 빠지면 되돌리기
setInterval(() => {
  if (!player || !cur || $("#player").hidden || typeof player.getCurrentTime !== "function") return;
  let t = 0, st = -1, vid = "";
  try { t = player.getCurrentTime(); st = player.getPlayerState(); vid = player.getVideoData().video_id; } catch { return; }
  if (vid && vid !== cur.id) { try { player.loadVideoById(cur.id, startAt(cur)); } catch {} return; }
  if (cur.series) {   // 아침 방송: 위치만 기억(도장·그만두기 없음)
    if (t > 0) { sprog[cur.series] = { ...(sprog[cur.series] || {}), pos: t }; store.set("sprog", sprog); }
    $("#quitBtn").hidden = true; return;
  }
  const p = prog[cur.id] || (prog[cur.id] = { pos: 0, seen: 0 });
  if (st === 1 && t > lastT && t - lastT < 2.5) p.seen += t - lastT;   // 앞으로 건너뛴 시간은 안 셈
  lastT = t;
  if (t > 0) p.pos = t;
  store.set("prog", prog);
  // 조금은 보고 나서 그만두기: 3분 또는 영상의 절반 중 짧은 쪽을 본 뒤에 버튼이 생겨요
  $("#quitBtn").hidden = p.seen < Math.min(QUIT_AFTER, (cur.sec || 0) / 2);
}, 1000);

const QUIT_AFTER = 180;
$("#quitBtn").addEventListener("click", () => {
  if (!cur) return;
  if (!confirm("이 영상 그만 볼까요?\n그만 봐도 티켓은 다시 돌아오지 않아요.")) return;
  const v = cur, p = prog[v.id] || { pos: 0, seen: 0 };
  p.quit = true; prog[v.id] = p; store.set("prog", prog);
  // 부모님용 기록: 아이가 어떤 영상을 그만뒀는지
  const quits = store.get("quits", []);
  quits.unshift({ id: v.id, title: v.title, ch: v.ch, seen: Math.round(p.seen), sec: v.sec, at: Date.now() });
  store.set("quits", quits.slice(0, 100));
  closePlayer();
  const left = basket.items.filter(x => !isDone(x)).length;
  $("#cheerTitle").textContent = "그만 봤어요";
  $("#cheerMsg").textContent = left ? `티켓이 ${left}장 남았어요` : "티켓 3장을 다 썼어요. 새로 고를 수 있어요!";
  $("#cheerStamp").hidden = true;
  $("#cheer").hidden = false;
});

function finish() {
  if (!cur) return;
  const v = cur, p = prog[v.id] || { pos: 0, seen: 0 };
  const ok = !v.sec || p.seen >= v.sec * 0.8;
  closePlayer();
  if (ok) {
    p.done = true; p.pos = v.sec; prog[v.id] = p; store.set("prog", prog);
    syncSeries(v.id);
    history = [{ ...v, at: Date.now() }, ...history.filter(h => h.id !== v.id)].slice(0, 200);
    store.set("history", history);
    const left = basket.items.filter(x => !isDone(x)).length;
    $("#cheerTitle").textContent = "끝까지 봤어요!";
    $("#cheerMsg").textContent = left ? `티켓이 ${left}장 남았어요` : "티켓 3장을 다 썼어요. 새로 고를 수 있어요!";
    $("#cheerStamp").hidden = false;
  } else {
    p.pos = 0; prog[v.id] = p; store.set("prog", prog);
    $("#cheerTitle").textContent = "앞으로 넘긴 부분이 있어요";
    $("#cheerMsg").textContent = "처음부터 끝까지 보면 '다 봤어요' 도장이 찍혀요";
    $("#cheerStamp").hidden = true;
  }
  $("#cheer").hidden = false;
  renderHome(ok ? v.id : null);
}
$("#cheerOk").addEventListener("click", () => { $("#cheer").hidden = true; });

function closePlayer() {
  pending = null; resumeOnReturn = false;
  if (player && player.destroy) { try { player.destroy(); } catch {} }
  player = null; cur = null;
  $("#quitBtn").hidden = true;
  $("#frame").innerHTML = "";
  $("#player").hidden = true;
  renderHome();
}
$("#back").addEventListener("click", closePlayer);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#player").hidden) closePlayer(); else if (!$("#picker").hidden) closePicker();
});

// 영상 영역 안에 들어가는 가장 큰 16:9 크기를 계산 (iPhone Safari 대응)
function fitFrame() {
  if ($("#player").hidden) return;
  const stage = $(".stage"), cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (w <= 0 || h <= 0) return;
  const fw = Math.floor(Math.min(w, h * 16 / 9));
  $("#frame").style.width = fw + "px"; $("#frame").style.height = Math.floor(fw * 9 / 16) + "px";
}
addEventListener("resize", fitFrame);
addEventListener("orientationchange", () => setTimeout(fitFrame, 300));
if (window.visualViewport) visualViewport.addEventListener("resize", fitFrame);

/* 전화가 와서 화면을 떠났다가 돌아오면 이어서 재생 (일부러 멈춘 지 3초 넘었으면 그대로) */
function playerState() { try { return player && player.getPlayerState ? player.getPlayerState() : -1; } catch { return -1; } }
document.addEventListener("visibilitychange", () => {
  if (!player || $("#player").hidden) { resumeOnReturn = false; return; }
  if (document.hidden) {
    const st = playerState();
    resumeOnReturn = st === 1 || st === 3 || (st === 2 && Date.now() - pausedAt < 3000);
  } else if (resumeOnReturn) {
    resumeOnReturn = false;
    [500, 1500, 3000].forEach(ms => setTimeout(() => {
      if (player && !$("#player").hidden && !document.hidden && playerState() !== 1) { try { player.playVideo(); } catch {} }
    }, ms));
  }
});

/* ---------- 타이머 (아침 15분, 오후 30분) ----------
   끝나는 시각을 저장하므로 앱을 닫았다 열어도 이어집니다. 시간이 다 되면 '여기까지' 화면(3초 꾹 눌러야 닫힘). */
let timerEnd = +store.get("timerEnd", 0) || 0;
let timeUp = String(store.get("timeUp", "0")) === "1";
let timerMin = +store.get("timerMin", 30) || 30;
let mode = store.get("mode", null);   // "morning" | "theater"
let wasOn = !!timerEnd;
/* 잘못 눌렀을 때: 시작하고 3분 안에는 '시간 다시 고르기'로 첫 화면에 돌아갈 수 있어요(타이머도 처음 상태로) */
const GRACE = 180000;
let timerStart = +store.get("timerStart", 0) || 0;
const inGrace = () => !!timerEnd && Date.now() - timerStart < GRACE;
function cancelTimer() {
  timerEnd = 0; store.set("timerEnd", null);
  closePlayer(); $("#picker").hidden = true; tick();
}
function startTimer(min, m) {
  if (timeUp) return;
  timerMin = min; mode = m; timerEnd = Date.now() + min * 60000; timerStart = Date.now();
  store.set("timerMin", min); store.set("mode", m); store.set("timerEnd", timerEnd); store.set("timerStart", timerStart);
  tick();
}
function tick() {
  const left = timerEnd ? timerEnd - Date.now() : 0;
  if (timerEnd && left <= 0) { timerEnd = 0; store.set("timerEnd", null); timeUp = true; store.set("timeUp", "1"); }
  const on = !!timerEnd;
  if (on !== wasOn) { wasOn = on; if (!on) { mode = null; store.set("mode", null); } renderHome(); }
  if (!$("#undo").hidden && !inGrace()) $("#undo").hidden = true;
  $("#timerRun").hidden = !on;
  if (on) $("#timerText").textContent = mmss(Math.ceil(left / 1000)) + " 남음";
  $("#timePill").hidden = !on;
  if (on) $("#pillText").textContent = mmss(Math.ceil(left / 1000));
  if (timeUp && $("#timeUp").hidden) {
    closePlayer(); $("#picker").hidden = true;
    $("#timeUpMsg").textContent = timerMin + "분 동안 잘 봤어요";
    $("#timeUp").hidden = false;
  }
}
$("#timerRun").addEventListener("click", () => {
  if (!inGrace() && !confirm("타이머를 끌까요?")) return;
  cancelTimer();
});
// 버튼이 보일 때 누르면 언제나 첫 화면으로(시간이 막 지난 순간에 눌러도)
$("#undo").addEventListener("click", cancelTimer);
let holdT = null; const hold = $("#holdBtn");
hold.addEventListener("pointerdown", e => {
  e.preventDefault(); hold.classList.add("holding");
  holdT = setTimeout(() => { holdEnd(); timeUp = false; store.set("timeUp", null); $("#timeUp").hidden = true; }, 3000);
});
function holdEnd() { clearTimeout(holdT); holdT = null; hold.classList.remove("holding"); }
["pointerup", "pointerleave", "pointercancel"].forEach(ev => hold.addEventListener(ev, holdEnd));
hold.addEventListener("contextmenu", e => e.preventDefault());
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

/* 홈 화면 앱은 예전 페이지를 계속 들고 있을 수 있어서, 화면으로 돌아올 때와 10분마다 새 버전이 있는지 확인해요.
   영상을 보거나 고르는 중에는 건드리지 않고, 첫 화면에 있을 때만 새로 불러와요. 올릴 때마다 BUILD를 바꿔 주세요. */
const BUILD = "2026-11-23-1";
async function checkUpdate() {
  if (!$("#player").hidden || !$("#picker").hidden || !$("#cheer").hidden) return;
  try {
    const t = await (await fetch("./?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const BUILD = "([^"]+)"/);
    if (m && m[1] !== BUILD) location.reload();
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
setInterval(checkUpdate, 10 * 60000);

// 예전 버전이 남긴 값 정리
["tab", "picks", "watched"].forEach(k => { try { localStorage.removeItem(k); } catch {} });
renderHome();
tick();
</script>
</body>
</html>
