<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English TV">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eaf4fb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>우리집 English TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap">
<style>
/* 레이아웃: 위에는 주제 탭, 아래는 큰 동그라미 채널 카드. 누르면 화면 전체 플레이어 */
:root {
  --bg: #eaf4fb;
  --surface: #ffffff;
  --ink: #1d3557;
  --muted: #5a7190;
  --sky: #2a9df4;
  --sun: #ffb703;
  --display: "Fredoka", "Jua", system-ui, sans-serif;
  --ko: "Jua", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ko);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.logo {
  width: 52px; height: 52px; border-radius: 16px; background: var(--sun);
  display: grid; place-items: center; flex: none;
  box-shadow: 0 4px 0 #e09e00;
}
.logo svg { width: 28px; height: 28px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); margin: 0; letter-spacing: .3px; }

.tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.tab {
  font-family: var(--ko); font-size: 19px;
  border: 0; border-radius: 999px; padding: 10px 18px;
  background: var(--surface); color: var(--ink); cursor: pointer;
  box-shadow: 0 3px 0 rgba(29,53,87,.12);
}
.tab[aria-pressed="true"] { background: var(--c, var(--sky)); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.tab:focus-visible, .card:focus-visible, .back:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

.section { margin-bottom: 30px; }
.section h2 {
  font-family: var(--ko); font-weight: 400; font-size: 24px; margin: 0 0 14px;
  display: flex; align-items: center; gap: 10px;
}
.section h2::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card {
  border: 0; background: var(--surface); border-radius: 26px; padding: 16px 12px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
  box-shadow: 0 5px 0 rgba(29,53,87,.10);
  transition: transform .12s ease;
  color: var(--ink); font: inherit;
}
.card:active { transform: translateY(3px) scale(.98); }
.avatar {
  width: 100%; max-width: 120px; aspect-ratio: 1; border-radius: 50%;
  object-fit: cover; background: #dde9f3;
  border: 5px solid var(--c);
}
.name { font-family: var(--display); font-weight: 600; font-size: 17px; text-align: center; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }

/* 플레이어 */
.player {
  position: fixed; inset: 0; background: #0b1320; z-index: 20;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.back {
  font-family: var(--ko); font-size: 20px; border: 0; border-radius: 999px;
  background: var(--sun); color: var(--ink); padding: 10px 20px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 0 #e09e00;
}
.now { color: #fff; font-family: var(--display); font-size: 20px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 영상 크기는 스크립트(fitFrame)가 stage의 실제 크기를 재서 정함. 아래는 스크립트 전 기본값 */
.stage { flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px 12px; overflow: hidden; }
.frame { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; flex: none; }
.frame iframe { width: 100%; height: 100%; border: 0; border-radius: 14px; background: #000; }
.player { position: fixed; }
.listbtn {
  margin-left: auto; flex: none;
  font-family: var(--ko); font-size: 18px; border: 0; border-radius: 999px;
  background: rgba(255,255,255,.14); color: #fff; padding: 9px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
}
.listbtn[aria-pressed="true"] { background: var(--sun); color: var(--ink); }
.listbtn:focus-visible, .ep:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.episodes {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 2px 12px 16px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start;
  grid-auto-rows: max-content;
}
.episodes:empty { display: none; }
.ep {
  position: relative; border: 0; padding: 0; cursor: pointer; background: #1f2b3d;
  border-radius: 12px; overflow: hidden; display: block; width: 100%;
}
.ep img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
.ep .no {
  position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff;
  font: 600 13px var(--display); padding: 2px 8px; border-radius: 8px;
}
.ep[aria-current="true"] { box-shadow: inset 0 0 0 4px var(--sun); }
.ep[aria-current="true"] img { opacity: .55; }
.ep[aria-current="true"] .no { background: var(--sun); color: var(--ink); }

/* 세로: 영상은 위, 목록은 아래에 항상 */
@media (orientation: portrait) {
  .player .stage { flex: none; }
  .listbtn { display: none; }
}
/* 가로: 영상을 크게, 목록은 버튼으로 열고 닫기 */
@media (orientation: landscape) {
  .player .episodes {
    position: absolute; left: 0; right: 0; bottom: 0; top: var(--bar-h, 60px);
    background: rgba(11,19,32,.97); z-index: 2; padding-top: 8px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .player:not(.show-list) .episodes { display: none; }
}

.foot { color: var(--muted); font-size: 14px; margin-top: 10px; text-align: center; }
.lang { font-family: var(--ko); font-size: 13px; color: var(--muted); }

/* 휴대폰 세로 */
@media (max-width: 560px) {
  .wrap { padding-block: 12px 28px; }
  header { margin-bottom: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 13px; }
  .tabs {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 16px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 2px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-size: 17px; padding: 9px 15px; flex: none; }
  .section { margin-bottom: 22px; }
  .section h2 { font-size: 21px; margin-bottom: 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .card { padding: 12px 8px 10px; border-radius: 22px; gap: 8px; }
  .avatar { border-width: 4px; max-width: 96px; }
  .name { font-size: 15px; }
  .back { font-size: 17px; padding: 8px 16px; }
  .now { font-size: 17px; }
  .episodes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
/* 휴대폰 가로: 영상을 최대한 크게 */
@media (max-height: 500px) {
  .bar { padding: 6px 10px; }
  .back, .listbtn { font-size: 16px; padding: 6px 14px; }
  .episodes { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .stage { padding: 0 8px 8px; }
}
/* 30분 타이머 */
.timers { margin-left: auto; display: flex; gap: 8px; flex: none; }
.timerbtn {
  flex: none;
  font-family: var(--ko); font-size: 18px; border: 0; border-radius: 999px;
  background: var(--surface); color: var(--ink); padding: 10px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 7px; box-shadow: 0 3px 0 rgba(29,53,87,.12);
  font-variant-numeric: tabular-nums;
}
.timerbtn[aria-pressed="true"] { background: var(--sky); color: #fff; }
.timerbtn:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.timepill {
  margin-left: auto; flex: none; color: #fff; background: rgba(42,157,244,.85);
  font: 600 16px var(--display); padding: 6px 12px; border-radius: 999px;
  display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;
}
.timepill:not([hidden]) + .listbtn { margin-left: 0; }
.timeup {
  position: fixed; inset: 0; z-index: 50; background: #1d3557; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px; text-align: center;
}
.timeup .moon { width: 120px; height: 120px; }
.timeup h2 { font-family: var(--ko); font-weight: 400; font-size: clamp(30px, 7vw, 48px); margin: 0; }
.timeup p { margin: 0; font-size: 20px; color: #c9d8ea; }
.hold {
  position: relative; overflow: hidden; margin-top: 24px;
  font-family: var(--ko); font-size: 17px; border: 2px solid rgba(255,255,255,.35); border-radius: 999px;
  background: transparent; color: #c9d8ea; padding: 12px 22px; cursor: pointer;
  -webkit-touch-callout: none; touch-action: none;
}
.hold::before {
  content: ""; position: absolute; inset: 0; background: rgba(255,183,3,.45);
  transform: scaleX(0); transform-origin: left; z-index: -1;
}
.hold.holding::before { transform: scaleX(1); transition: transform 3s linear; }
@media (max-width: 560px) {
  h1 { font-size: 24px; }
  .timers { gap: 6px; }
  .timerbtn { font-size: 15px; padding: 8px 10px; gap: 5px; }
}
@media (max-height: 500px) { .timepill { font-size: 14px; padding: 4px 10px; } }
/* 오늘의 추천 */
.picks h2 .prog { font-size: 17px; color: var(--muted); margin-left: 4px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.pick {
  border: 0; background: var(--surface); border-radius: 20px; padding: 8px 8px 12px; cursor: pointer;
  display: flex; flex-direction: column; gap: 7px; text-align: left; color: var(--ink); font: inherit;
  box-shadow: 0 5px 0 rgba(29,53,87,.10); border-top: 6px solid var(--c);
  transition: transform .12s ease;
}
.pick:active { transform: translateY(3px) scale(.98); }
.pick:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.thumb { position: relative; display: block; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: #dde9f3; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dur {
  position: absolute; right: 6px; bottom: 6px; background: rgba(11,19,32,.82); color: #fff;
  font-family: var(--display); font-size: 13px; padding: 1px 7px; border-radius: 8px; font-variant-numeric: tabular-nums;
}
.done {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,167,125,.55);
  color: #fff; font-family: var(--display); font-size: 40px; font-weight: 700;
}
.ptitle {
  font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.2; padding: 0 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em;
}
.pch { font-size: 13px; color: var(--muted); padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick.watched .ptitle { color: var(--muted); }

/* 끝까지 보기 잠금 */
.lockmsg {
  display: none; margin: 0 12px 10px; padding: 10px 14px; border-radius: 14px;
  background: rgba(255,183,3,.16); color: #ffd166; font-size: 17px; text-align: center;
}
.player.locked .lockmsg { display: block; }
.player.locked .episodes { opacity: .35; pointer-events: none; }
.player.locked .listbtn { display: none; }
.back .lk { display: none; }
.player.locked .back .lk { display: inline; }
.player.locked .back .arrow { display: none; }
.back { position: relative; overflow: hidden; -webkit-touch-callout: none; }
.back::after {
  content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.55);
  transform: scaleX(0); transform-origin: left; pointer-events: none;
}
.back.holding::after { transform: scaleX(1); transition: transform 3s linear; }
@media (orientation: landscape) { .player.locked .lockmsg { margin-bottom: 6px; padding: 6px 12px; font-size: 15px; } }
.foot a { color: var(--sky); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#1d3557"/><path d="M10 9.2v5.6l4.8-2.8z" fill="#fff"/></svg>
    </div>
    <h1>English TV</h1>
    <div class="timers" id="timers">
      <button class="timerbtn" type="button" data-min="15" aria-label="15분 타이머 시작"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M12 9v4.5l3 2M9 2.5h6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span>15분</span></button>
      <button class="timerbtn" type="button" data-min="30" aria-label="30분 타이머 시작"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M12 9v4.5l3 2M9 2.5h6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span>30분</span></button>
      <button class="timerbtn" id="timerRun" type="button" aria-pressed="true" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M12 9v4.5l3 2M9 2.5h6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span id="timerText"></span></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="주제"></nav>
  <main id="list"></main>
  <p class="foot">엄마 아빠가 고른 채널만 나와요 ·
    <a href="https://accounts.google.com/ServiceLogin?service=youtube&amp;continue=https%3A%2F%2Fwww.youtube.com%2F" target="_blank" rel="noopener">유튜브 로그인</a></p>
</div>

<div class="player" id="player" hidden>
  <div class="bar">
    <button class="back" id="back" type="button">
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="lk" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.6" fill="none"/></svg>
      돌아가기
    </button>
    <div class="now" id="now"></div>
    <span class="timepill" id="timePill" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M12 9v4.5l3 2M9 2.5h6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span id="pillText"></span></span>
    <button class="listbtn" id="listBtn" type="button" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="3" y="13" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="13" width="7" height="7" rx="2" fill="currentColor"/></svg>
      다른 영상
    </button>
  </div>
  <div class="stage"><div class="frame" id="frame"></div></div>
  <p class="lockmsg" id="lockMsg">이 영상을 끝까지 보면 다른 영상을 고를 수 있어요</p>
  <div class="episodes" id="episodes" aria-label="다른 영상"></div>
</div>

<div class="timeup" id="timeUp" hidden>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#ffb703"/><circle cx="17" cy="5" r="1.2" fill="#fff"/><circle cx="20.5" cy="9" r=".8" fill="#fff"/></svg>
  <h2>오늘 영상은 여기까지!</h2>
  <p id="timeUpMsg">영상 잘 봤어요</p>
  <button class="hold" id="holdBtn" type="button">엄마 아빠가 3초 꾹 누르면 닫혀요</button>
</div>

<script>

  { cat: "words", name: "Arthur",            id: "UCSPzXeCRf12qayHCAtuffzw", img: "r3YrwudcbU5JW63Gh37EkoRh2Dq_dnZD96Y15c2Jb9o_qic4XBzOwoQhBJbAofrabE21EBgl" },

  // 과학과 기계: 수학 탐정, 실험, 자동차·몬스터트럭, 공구

  { cat: "science", name: "Dr. Binocs", id: "UCxlJ45KjG4XVcQ_hd8j227A", img: "ytc/AIdro_lTFIu2b6QlZMJHCQ2F3--ukEBs8fd_tEahtv38sm8WwME" },

/* ---------- 오늘의 추천 ----------
   pool.json(매일 GitHub Actions가 갱신하는 2~15분짜리 영상 모음)에서
   묶음마다 서로 다른 채널 2개씩, 모두 12개를 고릅니다.
   날짜로 정해지므로 하루 동안은 같은 영상이 나오고, 다 본 영상에는 ✓가 붙어요. */
const PICKS_PER_GROUP = 2;
let POOL = null;
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function seeded(str) {          // 날짜 글자로 정해지는 난수
  let h = 1779033703 ^ str.length;
  for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 3432918353), h = (h << 13) | (h >>> 19);
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function readDay(k) {
  try { const v = JSON.parse(localStorage.getItem(k)); return v && v.date === today() ? v : null; } catch { return null; }
}
function writeDay(k, v) { try { localStorage.setItem(k, JSON.stringify({ date: today(), ...v })); } catch {} }

function todaysPicks() {
  const saved = readDay("picks");
  if (saved) return saved.list;                       // 오늘 이미 골랐으면 그대로
  if (!POOL) return [];
  const r = seeded(today()), list = [];
  const keys = new Set(CHANNELS.map(c => c.key));     // 지금 목록에 있는 채널만
  for (const cat of CATEGORIES) {
    const vids = POOL.filter(v => v.cat === cat.key && keys.has(v.key));
    const chans = [...new Set(vids.map(v => v.key))];
    for (let i = chans.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [chans[i], chans[j]] = [chans[j], chans[i]]; }
    for (const k of chans.slice(0, PICKS_PER_GROUP)) {
      const mine = vids.filter(v => v.key === k);
      list.push(mine[Math.floor(r() * mine.length)]);
    }
  }
  if (list.length) writeDay("picks", { list });
  return list;
}
function watchedSet() { return new Set((readDay("watched") || { ids: [] }).ids); }
function markWatched(id) {
  const w = watchedSet(); if (!id || w.has(id)) return;
  w.add(id); writeDay("watched", { ids: [...w] });
  renderList();
}
function renderPicks() {
  const picks = todaysPicks(); if (!picks.length) return "";
  const w = watchedSet(), n = picks.filter(v => w.has(v.id)).length;
  const color = k => (CATEGORIES.find(c => c.key === k) || {}).color || "#2a9df4";
  return `<section class="section picks" style="--c:var(--sun)">
    <h2>오늘의 추천 <span class="prog">${n === picks.length ? "다 봤어요! 최고예요" : n + " / " + picks.length}</span></h2>
    <div class="pgrid">${picks.map((v, i) => `
      <button class="pick${w.has(v.id) ? " watched" : ""}" type="button" data-i="${i}" style="--c:${color(v.cat)}">
        <span class="thumb">
          <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">
          <span class="dur">${Math.floor(v.sec / 60)}:${String(v.sec % 60).padStart(2, "0")}</span>
          ${w.has(v.id) ? '<span class="done" aria-label="다 봤어요">✓</span>' : ""}
        </span>
        <span class="ptitle">${esc(v.title)}</span>
        <span class="pch">${esc(v.ch)}</span>
      </button>`).join("")}
    </div></section>`;
}
function openPick(i) {
  const picks = todaysPicks(), w = watchedSet();
  // 누른 영상부터, 그다음은 아직 안 본 추천 영상을 차례로 이어서 재생
  const rest = [...picks.slice(i + 1), ...picks.slice(0, i)].filter(v => !w.has(v.id));
  openWith("오늘의 추천", { videos: [picks[i].id, ...rest.map(v => v.id)], lang: "en", name: "오늘의 추천" });
}
fetch("pool.json", { cache: "no-cache" }).then(r => r.json()).then(d => { POOL = d.videos; renderList(); }).catch(() => {});

/* ---------- 플레이어 ----------
   YouTube IFrame API로 재생하고, 재생목록의 영상 ID를 받아
   페이지 안에 그림 목록을 직접 그립니다(작은 화면에서는 유튜브 목록 버튼이 숨겨지기 때문). */
let player = null, apiReady = false, pending = null, shownIds = "";
let pausedAt = 0, resumeOnReturn = false;

window.onYouTubeIframeAPIReady = () => {
  apiReady = true;
  if (pending) { const p = pending; pending = null; startPlayer(p); }
};
(function loadApi() {
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();

function openChannel(id) {
  if (timeUp) return;
  const ch = CHANNELS.find(c => c.key === id);
  if (!ch) return;
  // 재생목록이 지정돼 있으면 그것을, 아니면 UULF(쇼츠·라이브를 뺀 일반 영상 전체)를 재생
  const list = ch.videos ? null : (ch.list || ("UULF" + ch.id.slice(2)));
  const english = !ch.lang || ch.lang.startsWith("English");
  openWith(ch.name, { list, videos: ch.videos, lang: english ? "en" : "ko", name: ch.name });
}

function openWith(title, opts) {
  if (timeUp) return;
  $("#now").textContent = title;
  $("#player").classList.remove("show-list");
  $("#listBtn").setAttribute("aria-pressed", "false");
  $("#episodes").innerHTML = ""; shownIds = "";
  $("#player").hidden = false;
  fitFrame();
  if (apiReady) startPlayer(opts);
  else {
    pending = opts;
    // API가 늦거나 막히면 목록 없이 기본 플레이어로라도 재생
    setTimeout(() => { if (pending === opts) { pending = null; plainPlayer(opts); } }, 5000);
  }
}

function playerVars(o) {
  // videos: 영상 ID 여러 개를 순서대로 재생하는 임시 재생목록
  const pl = o.videos ? { playlist: o.videos.join(",") } : { listType: "playlist", list: o.list };
  return { ...pl, rel: 0, playsinline: 1, autoplay: 1,
           modestbranding: 1, iv_load_policy: 3, hl: o.lang, cc_lang_pref: o.lang };
}

function startPlayer(o) {
  if ($("#player").hidden) return;
  $("#frame").innerHTML = '<div id="yt"></div>';
  player = new YT.Player("yt", {
    // 로그인(유튜브 프리미엄)이 적용되려면 nocookie가 아닌 youtube.com 플레이어여야 함
    host: "https://www.youtube.com",
    width: "100%", height: "100%",
    ...(o.videos ? { videoId: o.videos[0] } : {}),
    playerVars: playerVars(o),
    events: {
      onReady: () => { refreshList(); },
      onStateChange: e => {
        if (e.data === 2) pausedAt = Date.now();   // 2 = 일시정지
        if (e.data === 0) {                        // 0 = 끝까지 봄 → 다른 영상 고르기 가능
          setLock(false);
          try { markWatched(player.getVideoData().video_id); } catch {}
        }
        refreshList();
      },
    },
  });
  // 재생목록 정보가 조금 늦게 올 때를 대비해 몇 번 다시 확인
  let tries = 0;
  const t = setInterval(() => { refreshList(); if (shownIds || ++tries > 10 || !player) clearInterval(t); }, 800);
}

function plainPlayer(o) {
  if ($("#player").hidden) return;
  const params = new URLSearchParams(Object.entries(playerVars(o)).filter(([k]) => k !== "listType"));
  const path = o.videos ? o.videos[0] : "videoseries";
  $("#frame").innerHTML = `<iframe src="https://www.youtube.com/embed/${path}?${params}"
    title="${o.name}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}

function refreshList() {
  if (!player || typeof player.getPlaylist !== "function") return;
  const ids = player.getPlaylist();
  if (!ids || !ids.length) return;
  const box = $("#episodes");
  if (ids.join() !== shownIds) {
    shownIds = ids.join();
    box.innerHTML = ids.map((v, i) => `
      <button class="ep" type="button" data-i="${i}" aria-label="${i + 1}번 영상">
        <img src="https://i.ytimg.com/vi/${v}/mqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">
        <span class="no">${i + 1}</span>
      </button>`).join("");
    fitFrame();
  }
  const cur = player.getPlaylistIndex();
  box.querySelectorAll(".ep").forEach(b => b.setAttribute("aria-current", String(+b.dataset.i === cur)));
}

$("#episodes").addEventListener("click", e => {
  const b = e.target.closest(".ep"); if (!b || !player) return;
  player.playVideoAt(+b.dataset.i);
  setList(false);
  if (matchMedia("(orientation: portrait)").matches) $("#player").scrollTop = 0;
});

/* ---------- 끝까지 보기 ----------
   영상 시작 후 1분 동안은 마음대로 바꿀 수 있고(맛보기),
   1분이 지나면 그 영상이 끝날 때까지 다른 영상 고르기와 '돌아가기'가 잠깁니다.
   부모님은 '돌아가기'를 3초 꾹 누르면 언제든 나갈 수 있어요. */
const TRY_SEC = 60;
let lockedVideo = "";
function setLock(on) { $("#player").classList.toggle("locked", on); if (on) setList(false); }
setInterval(() => {
  if (!player || $("#player").hidden || typeof player.getCurrentTime !== "function") return;
  let vid = "", t = 0, st = -1;
  try { vid = player.getVideoData().video_id; t = player.getCurrentTime(); st = player.getPlayerState(); } catch { return; }
  if (vid !== lockedVideo) { lockedVideo = vid; setLock(false); }   // 새 영상이 시작되면 다시 맛보기
  if (st !== 0 && t >= TRY_SEC) setLock(true);
  // 재생목록에서는 끝나자마자 다음 영상으로 넘어가 '끝' 신호를 놓칠 수 있어, 끝나기 5초 전이면 본 걸로
  let dur = 0; try { dur = player.getDuration(); } catch {}
  if (dur > 0 && t >= dur - 5) markWatched(vid);
}, 1000);

// 잠겨 있을 때 '돌아가기'는 3초 꾹 눌러야 동작
let backT = null;
const backBtn = $("#back");
backBtn.addEventListener("pointerdown", () => {
  if (!$("#player").classList.contains("locked")) return;
  backBtn.classList.add("holding");
  backT = setTimeout(() => { backT = "done"; backBtn.classList.remove("holding"); closePlayer(); }, 3000);
});
["pointerup", "pointerleave", "pointercancel"].forEach(ev => backBtn.addEventListener(ev, () => {
  if (backT && backT !== "done") clearTimeout(backT);
  backBtn.classList.remove("holding");
}));
backBtn.addEventListener("contextmenu", e => e.preventDefault());

function setList(open) {
  $("#player").classList.toggle("show-list", open);
  $("#listBtn").setAttribute("aria-pressed", String(open));
}
$("#listBtn").addEventListener("click", () => {
  setList(!$("#player").classList.contains("show-list"));
});

// 영상 영역 안에 들어가는 가장 큰 16:9 크기를 직접 계산 (iPhone Safari 대응)
function fitFrame() {
  if ($("#player").hidden) return;
  const player_ = $("#player");
  const bar = player_.querySelector(".bar");
  player_.style.setProperty("--bar-h", bar.offsetHeight + "px");
  const stage = player_.querySelector(".stage");
  const cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let h;
  if (matchMedia("(orientation: portrait)").matches) {
    // 세로: 폭에 맞추되, 아래 목록이 보이도록 높이는 화면의 절반까지만
    h = Math.min(w * 9 / 16, player_.clientHeight * 0.5);
  } else {
    h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  }
  if (w <= 0 || h <= 0) return;
  const fw = Math.floor(Math.min(w, h * 16 / 9));
  const frame = $("#frame");
  frame.style.width = fw + "px";
  frame.style.height = Math.floor(fw * 9 / 16) + "px";
}
addEventListener("resize", fitFrame);
addEventListener("orientationchange", () => setTimeout(fitFrame, 300));
if (window.visualViewport) visualViewport.addEventListener("resize", fitFrame);

/* 전화가 오면 iPhone이 영상을 멈추고 통화 화면으로 넘어갑니다.
   화면을 떠나는 순간 재생 중이었다면(또는 방금 막 멈췄다면) 기억해 두었다가,
   통화가 끝나고 이 화면으로 돌아오면 이어서 재생합니다.
   부모가 일부러 멈춘 뒤 3초 넘게 지나 화면을 떠난 경우는 다시 틀지 않습니다. */
function playerState() {
  try { return player && player.getPlayerState ? player.getPlayerState() : -1; } catch { return -1; }
}
document.addEventListener("visibilitychange", () => {
  if (!player || $("#player").hidden) { resumeOnReturn = false; return; }
  if (document.hidden) {
    const st = playerState();   // 1 = 재생 중, 3 = 버퍼링
    resumeOnReturn = st === 1 || st === 3 || (st === 2 && Date.now() - pausedAt < 3000);
  } else if (resumeOnReturn) {
    resumeOnReturn = false;
    // 돌아온 직후엔 오디오가 아직 통화에 묶여 있을 수 있어 몇 번 나눠 시도
    [500, 1500, 3000].forEach(ms => setTimeout(() => {
      if (player && !$("#player").hidden && !document.hidden && playerState() !== 1) {
        try { player.playVideo(); } catch {}
      }
    }, ms));
  }
});

/* ---------- 30분 타이머 ----------
   끝나는 시각을 저장해 두므로 새로고침하거나 앱을 닫았다 열어도 이어집니다.
   시간이 다 되면 영상을 끄고 '여기까지' 화면을 띄우며, 이 화면은 3초 꾹 눌러야 닫힙니다. */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let timerEnd = +store.get("timerEnd") || 0;
let timeUp = store.get("timeUp") === "1";
let timerMin = +store.get("timerMin") || 30;

function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}
function tick() {
  const left = timerEnd ? timerEnd - Date.now() : 0;
  if (timerEnd && left <= 0) {
    timerEnd = 0; store.set("timerEnd", null);
    timeUp = true; store.set("timeUp", "1");
  }
  const on = !!timerEnd;
  document.querySelectorAll("#timers [data-min]").forEach(b => b.hidden = on);
  $("#timerRun").hidden = !on;
  if (on) $("#timerText").textContent = fmt(left) + " 남음";
  $("#timePill").hidden = !on;
  if (on) $("#pillText").textContent = fmt(left);
  if (timeUp && $("#timeUp").hidden) {
    closePlayer();
    $("#timeUpMsg").textContent = timerMin + "분 동안 잘 봤어요";
    $("#timeUp").hidden = false;
  }
}
// 아침 15분, 오후 30분: 버튼 하나를 누르면 그 시간으로 시작
$("#timers").addEventListener("click", e => {
  const b = e.target.closest(".timerbtn"); if (!b) return;
  if (b.id === "timerRun") {
    if (!confirm("타이머를 끌까요?")) return;
    timerEnd = 0;
  } else {
    timerMin = +b.dataset.min;
    timerEnd = Date.now() + timerMin * 60 * 1000;
    store.set("timerMin", timerMin);
  }
  store.set("timerEnd", timerEnd || null);
  tick();
});

// 3초 꾹 누르기 (아이가 한 번 톡 눌러서는 닫히지 않게)
let holdT = null;
const hold = $("#holdBtn");
function holdStart(e) {
  e.preventDefault();
  hold.classList.add("holding");
  holdT = setTimeout(() => {
    holdEnd();
    timeUp = false; store.set("timeUp", null);
    $("#timeUp").hidden = true;
  }, 3000);
}
function holdEnd() { clearTimeout(holdT); holdT = null; hold.classList.remove("holding"); }
hold.addEventListener("pointerdown", holdStart);
["pointerup", "pointerleave", "pointercancel"].forEach(ev => hold.addEventListener(ev, holdEnd));
hold.addEventListener("contextmenu", e => e.preventDefault());

setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

function closePlayer() {
  pending = null; resumeOnReturn = false;
  setLock(false); lockedVideo = "";
  if (player && player.destroy) { try { player.destroy(); } catch {} }
  player = null; shownIds = "";
  $("#frame").innerHTML = "";
  $("#episodes").innerHTML = "";
  setList(false);
  $("#player").hidden = true;
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  current = b.dataset.key; saveTab(current); renderTabs(); renderList();
});
$("#list").addEventListener("click", e => {
  const p = e.target.closest(".pick"); if (p) return openPick(+p.dataset.i);
  const b = e.target.closest(".card"); if (b) openChannel(b.dataset.id);
});
$("#back").addEventListener("click", () => {
  if (backT === "done") { backT = null; return; }          // 꾹 눌러서 이미 닫힘
  if ($("#player").classList.contains("locked")) {         // 잠겨 있으면 안내만
    const m = $("#lockMsg"); m.animate([{ transform: "scale(1.06)" }, { transform: "none" }], 300);
    return;
  }
  closePlayer();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });

current = loadTab();
if (current !== "all" && !CATEGORIES.some(c => c.key === current)) current = "all";
renderTabs(); renderList();
tick();
</script>
</body>
</html>
